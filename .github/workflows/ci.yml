name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  validate:
    name: Validate extension packaging
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2.23.0
        with:
          egress-policy: audit
          allowed-endpoints: >
            cacerts.digicert.com:80
            cdn.powershellgallery.com:443
            crl.microsoft.com:80
            dns.msftncsi.com:443
            github.com:443
            hosted-compute-watchdog-prod-iad-02.githubapp.com:443
            ocsp.digicert.com:80
            ocsp.sectigo.com:80
            www.microsoft.com:80
            www.powershellgallery.com:443

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run Pester tests
        shell: pwsh
        run: |
          $stopMarker = [guid]::NewGuid().ToString()
          Write-Host "::stop-commands::$stopMarker"
          try {
            Install-Module -Name Pester -MinimumVersion 5.0 -Force -Scope CurrentUser
            $testPaths = @("$env:GITHUB_WORKSPACE/agent-screenshot", "$env:GITHUB_WORKSPACE/.github/scripts")
            Push-Location $env:RUNNER_TEMP
            try { Invoke-Pester -Path $testPaths -Output Detailed -CI }
            finally { Pop-Location }
          }
          finally { Write-Host "::$stopMarker::" }

      - name: Validate extension packaging
        uses: jessehouwing/azdo-marketplace/package@v6.4.1
        with:
          extension-version: 0.0.0
          extension-visibility: private
          output-path: ${{ runner.temp }}
